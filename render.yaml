services:
  - type: web
    name: ai-trainer-web-jaggu30
    runtime: node
    region: singapore
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm run start -- -H 0.0.0.0 -p $PORT
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.17.0
      - key: NEXT_PUBLIC_API_BASE_URL
        value: /api/backend
      # Free Render web services cannot receive private-network traffic.
      # The browser never calls this URL directly: the Next.js route proxy
      # makes this server-to-server request, so CORS remains unnecessary.
      - key: BACKEND_API_URL
        value: https://ai-trainer-api-jaggu30.onrender.com/api/v1

  - type: web
    name: ai-trainer-api-jaggu30
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r backend/requirements.txt && pip install .
    startCommand: sh backend/start-render.sh
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: ai-gym-fitness-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: MQTT_ENABLED
        value: "false"

databases:
  - name: ai-gym-fitness-db
    region: singapore
    plan: free
    databaseName: ai_gym
